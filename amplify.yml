version: 1
frontend:
  phases:
    preBuild:
      commands:
        # pnpm 의 node_modules 는 심링크 구조라 Amplify 캐시 복원 시 깨진다(작업 2: @swc/helpers 모듈 누락).
        # node_modules 대신 pnpm 스토어만 캐시하고 매번 새로 링크한다.
        - corepack enable && corepack prepare pnpm@11.1.2 --activate
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*
