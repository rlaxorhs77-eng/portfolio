version: 1
frontend:
  phases:
    preBuild:
      commands:
        # pnpm 의 node_modules 는 심링크 구조라 Amplify 캐시 복원 시 깨진다(작업 2: @swc/helpers 모듈 누락).
        # node_modules 대신 pnpm 스토어만 캐시하고 매번 새로 링크한다.
        - corepack enable && corepack prepare pnpm@11.1.2 --activate
        - pnpm config set store-dir .pnpm-store
        # 이전 node_modules 캐시가 남아 있어도 링크를 다시 구성한다.
        # 작업 4에서는 설치를 생략한 뒤 Next의 전이 의존성 로딩에 실패했다.
        - pnpm install --frozen-lockfile --force
        - node scripts/verify-build-dependencies.mjs
    build:
      commands:
        - pnpm build
  artifacts:
    baseDirectory: out
    files:
      - '**/*'
  cache:
    paths:
      - .pnpm-store/**/*
